kind = "mobile"
previewPath = "/"
title = "Svasthic"
description = "Local-first adaptive fitness for busy professionals, with quick workout adjustments, timers, rep logging, and preserved history."
version = "1.0.0"
id = "artifacts/adaptive-fitness"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26022

[services.development]
run = "pnpm --filter @workspace/adaptive-fitness run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adaptive-fitness", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/adaptive-fitness", "run", "serve" ]

[services.env]
PORT = "26022"
BASE_PATH = "/"
